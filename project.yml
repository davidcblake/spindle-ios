# What the Xcode project is, in a file a person can read and a reviewer can
# argue with. `xcodegen generate` turns this into Spindle.xcodeproj, which is
# deliberately not committed.
name: Spindle

options:
  bundleIdPrefix: com.wpv
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  PlugAndPlay:
    url: https://github.com/davidcblake/plug-and-play-ios
    # A tagged version, never `main` -- a change to the foundation must not be
    # able to break a shipped app. Taking a newer one is a decision somebody
    # makes on purpose.
    from: 0.1.0

targets:
  Spindle:
    type: application
    platform: iOS
    sources:
      - Sources
    # Gives the generated Spindle scheme a Test action, so `xcodebuild test`
    # runs SpindleTests rather than finding nothing to run.
    scheme:
      testTargets:
        - SpindleTests
    dependencies:
      - package: PlugAndPlay
        product: PPCore
      - package: PlugAndPlay
        product: PPData
      - package: PlugAndPlay
        product: PPDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wpv.spindle
        # The web app's icon (spindle/public/icons/ios-1024.png), with its
        # alpha channel removed: App Store Connect refuses an icon that has one,
        # even when nothing in it is transparent.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Xcode signs with whichever team is chosen under Signing &
        # Capabilities. CI turns signing off on its own command line
        # (.github/workflows/build.yml), so it needs no certificates; turning it
        # off here as well stopped the app installing on a phone at all.
        CODE_SIGN_STYLE: Automatic
    # App Attest, which is how the study server knows a request comes from a
    # genuine copy of Spindle (decision 0002 in the Spindle repository). The
    # App ID needs the App Attest capability ticked in the developer portal
    # before a signed build will carry this.
    entitlements:
      path: Spindle.entitlements
      properties:
        com.apple.developer.devicecheck.appattest-environment: production
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Spindle
        # Where studies and plans are prepared. Until the server's half is
        # set up (SETUP.md section 6 in the Spindle repository), it answers
        # "isn't set up on the server yet", which the app shows as it is.
        SpindleServer: https://spindlestudy.vercel.app
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  SpindleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Spindle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
