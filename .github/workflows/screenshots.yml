name: App Store screenshots

# Run by hand: Actions → "App Store screenshots" → Run workflow. Mac minutes
# cost roughly ten times Linux ones, so this never runs on its own.
#
# Builds a debug copy for the simulator, opens each screen with sample content
# (Sources/Screenshot.swift) on the largest iPhone, and saves the pictures as
# the "app-store-screenshots" download on the run's page. A Pro Max simulator
# gives 1320 × 2868, the 6.9-inch size App Store Connect asks for.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      # The largest iPhone on the newest runtime: a "Pro Max" by name.
      - name: Choose the Pro Max simulator
        id: simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "SimRuntime.iOS-" not in runtime:
                  continue
              try:
                  version = tuple(int(p) for p in runtime.split("SimRuntime.iOS-")[-1].split("-"))
              except ValueError:
                  continue
              for d in devices:
                  if "Pro Max" in d.get("name", "") and d.get("isAvailable", True):
                      key = (version, d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"])
          if best is None:
              sys.exit("No Pro Max simulator on this runner")
          print(best[1])
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build for the simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Spindle.xcodeproj \
            -scheme Spindle \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            SPINDLE_ICLOUD_SYNC=NO

      - name: Take the screenshots
        run: |
          set -euo pipefail
          UDID="${{ steps.simulator.outputs.udid }}"
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Apple's own convention for marketing screenshots: 9:41, full bars.
          xcrun simctl status_bar "$UDID" override --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          n=1
          for screen in today study journal plans; do
            xcrun simctl launch --terminate-running-process "$UDID" com.wpv.spindle -screenshot "$screen"
            sleep 6
            xcrun simctl io "$UDID" screenshot "screenshots/${n}-${screen}.png"
            n=$((n + 1))
          done
          # The same four in dark mode, in case the listing should show it.
          xcrun simctl ui "$UDID" appearance dark
          for screen in today study journal plans; do
            xcrun simctl launch --terminate-running-process "$UDID" com.wpv.spindle -screenshot "$screen"
            sleep 6
            xcrun simctl io "$UDID" screenshot "screenshots/dark-${n}-${screen}.png"
            n=$((n + 1))
          done
          sips -g pixelWidth -g pixelHeight screenshots/*.png

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-store-screenshots
          path: screenshots
          retention-days: 30
